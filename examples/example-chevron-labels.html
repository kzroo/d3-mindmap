<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D3 Mindmap Chevron + Label Backgrounds</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; height: 100vh; overflow: hidden; background: #f5f5f5; }
    .container { width: 100%; height: 100vh; position: relative; }
    .controls { position: absolute; top: 15px; right: 20px; z-index: 1000; padding: 12px; border-radius: 8px; }
    .controls button { display: block; width: 100%; padding: 10px 15px; background: #4dabf7; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; transition: background 0.2s; }
    .controls button:hover { background: #339af0; }
  </style>
</head>
<body>
  <div class="container" id="mindmap-container"></div>
  <div class="controls">
    <button id="theme-toggle">Toggle Theme</button>
  </div>

  <script type="module">
    import getRender from '../dist/index.js';

    let currentTheme = 'light';

    const mindmapData = {
      name: 'Product Strategy',
      labelBackground: { light: '#e7f5ff', dark: '#2b2f38' },
      children: [
        {
          name: 'Vision',
          labelBackground: { light: '#fff3bf', dark: '#5c4b24' },
          children: [
            { name: 'North Star', labelBackground: { light: '#f1f3f5', dark: '#3a3f46' } },
            { name: 'KPIs', labelBackground: { light: '#f8f0fc', dark: '#3f2e4d' } }
          ]
        },
        {
          name: 'Roadmap',
          labelBackground: { light: '#e6fcf5', dark: '#20403b' },
          collapsed: true,
          children: [
            { name: 'Q1', labelBackground: { light: '#ffe8cc', dark: '#4a3723' } },
            { name: 'Q2', labelBackground: { light: '#d0ebff', dark: '#1f3b54' } },
            { name: 'Q3', labelBackground: { light: '#f8f0fc', dark: '#3f2e4d' } }
          ]
        },
        {
          name: 'Execution',
          labelBackground: { light: '#fceff5', dark: '#4b2f3a' },
          children: [
            { name: 'Engineering', labelBackground: { light: '#f1f3f5', dark: '#3a3f46' } },
            { name: 'Design', labelBackground: { light: '#f1f3f5', dark: '#3a3f46' }, collapsed: true, children: [{ name: 'UX' }, { name: 'UI' }] },
            { name: 'Marketing', labelBackground: { light: '#f1f3f5', dark: '#3a3f46' } }
          ]
        }
      ]
    };

    const container = document.getElementById('mindmap-container');
    const render = getRender(container, {
      nodeShape: 'chevron',
      chevronSize: 12,
      defaultNodeSize: 5,
      labelBackground: () => currentTheme === 'dark' ? '#2b2f38' : '#f8f9fa'
    });

    const { setTheme } = render(mindmapData);

    document.getElementById('theme-toggle').addEventListener('click', () => {
      currentTheme = currentTheme === 'light' ? 'dark' : 'light';
      setTheme(currentTheme);
    });
  </script>
</body>
</html>
